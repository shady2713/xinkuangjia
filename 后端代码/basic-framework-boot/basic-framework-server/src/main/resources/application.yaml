spring:
  application:
    name: basic-framework-server
  config:
    import:
      - optional:file:.env[.properties]        # 工作目录在项目根时
      - optional:file:../.env[.properties]     # IDEA 默认工作目录在 basic-framework-server 模块时
  servlet:
    multipart:
      # 单文件 50MB；请求体 55MB，为 multipart 边界和表单字段预留少量开销。
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    serialization:
      write-dates-as-timestamps: true
      write-date-timestamps-as-nanoseconds: false
      write-durations-as-timestamps: true
      fail-on-empty-beans: false
  task:
    execution:
      thread-name-prefix: async-task-
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 200
        keep-alive: 60s
  cache:
    type: REDIS
    redis:
      time-to-live: 1h
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:48080}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

logging:
  file:
    name: ${LOG_FILE:logs/basic-framework-server.log}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: NONE
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: ${basic-framework.info.base-package}.module.**.dal.dataobject

aj:
  captcha:
    cache-type: redis
    cache-number: 1000
    timing-clear: 180
    type: blockPuzzle
    aes-status: ${CAPTCHA_AES_STATUS:false}
    water-mark: basic-framework
    interference-options: 0
    req-frequency-limit-enable: false
    req-get-lock-limit: 5
    req-get-lock-seconds: 10
    req-get-minute-limit: 30
    req-check-minute-limit: 60
    req-verify-minute-limit: 60

basic-framework:
  info:
    version: ${APP_VERSION:1.0.0}
    base-package: com.basicframework
  user:
    # 批量导入用户时使用的默认初始密码；留空时拒绝导入。
    init-password: ${USER_INIT_PASSWORD:}
  file:
    # 存储提供方：local（默认，本地磁盘/断网政务内网兜底）或 aliyun-oss（生产阿里云 OSS）
    provider: ${FILE_STORAGE_PROVIDER:local}
    local:
      base-path: ${FILE_LOCAL_BASE_PATH:./.local-storage}
      domain: ${FILE_LOCAL_DOMAIN:/admin-api/infra/file/content}
      public-access: ${FILE_LOCAL_PUBLIC_ACCESS:true}
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      access-key: ${ALIYUN_OSS_ACCESS_KEY:}
      secret-key: ${ALIYUN_OSS_SECRET_KEY:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      region: ${ALIYUN_OSS_REGION:oss-cn-hangzhou}
      public-url: ${ALIYUN_OSS_PUBLIC_URL:}
      public-access: ${ALIYUN_OSS_PUBLIC_ACCESS:false}
      signing-endpoint: ${ALIYUN_OSS_SIGNING_ENDPOINT:}
  sms:
    aliyun:
      enabled: ${ALIYUN_SMS_ENABLED:false}
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      login-template-code: ${ALIYUN_SMS_LOGIN_TEMPLATE_CODE:}
      reset-password-template-code: ${ALIYUN_SMS_RESET_PASSWORD_TEMPLATE_CODE:}
  web:
    admin-ui:
      url: ${ADMIN_UI_URL:http://localhost:5175}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175,http://127.0.0.1:5175}
  xss:
    enable: true
  security:
    permit-all-urls: []
    # 密码传输使用 SM2（C1C3C2）。私钥只从环境变量注入，缺失或格式错误时启动失败。
    sm2:
      private-key: ${SM2_PRIVATE_KEY:}
      timestamp-window: ${SM2_TIMESTAMP_WINDOW:5m}
      nonce-ttl: ${SM2_NONCE_TTL:10m}
      replay-check-enabled: ${SM2_REPLAY_CHECK_ENABLED:true}
    # 登录失败锁定：按账号计数，成功登录清零；锁定时返回通用提示。
    login-lock:
      enabled: ${LOGIN_LOCK_ENABLED:true}
      max-failures: ${LOGIN_LOCK_MAX_FAILURES:5}
      lock-duration: ${LOGIN_LOCK_DURATION:30m}
      failure-window: ${LOGIN_LOCK_FAILURE_WINDOW:30m}
    # 短信登录按手机号和 IP 两个维度计数与锁定，提示不区分手机号是否注册。
    sms-login-lock:
      enabled: ${SMS_LOGIN_LOCK_ENABLED:true}
      max-failures: ${SMS_LOGIN_LOCK_MAX_FAILURES:5}
      ip-max-failures: ${SMS_LOGIN_LOCK_IP_MAX_FAILURES:20}
      lock-duration: ${SMS_LOGIN_LOCK_DURATION:30m}
      failure-window: ${SMS_LOGIN_LOCK_FAILURE_WINDOW:30m}
    # 管理后台会话：访问令牌 30 分钟、刷新令牌 30 天，空闲 30 分钟强制失效。
    session:
      idle-timeout: ${SESSION_IDLE_TIMEOUT:30m}
      access-token-validity: ${ACCESS_TOKEN_VALIDITY:30m}
      refresh-token-validity: ${REFRESH_TOKEN_VALIDITY:30d}
    # Redis 不可用时的降级策略：local-fallback（默认，单实例内存兜底）或 fail-closed。
    redis-unavailable-strategy: ${REDIS_UNAVAILABLE_STRATEGY:local-fallback}
  captcha:
    enable: true
  swagger:
    title: ${SWAGGER_TITLE:basic-framework API}
    description: ${SWAGGER_DESCRIPTION:Admin and app API documentation}
    author: ${SWAGGER_AUTHOR:李杰}
    version: ${basic-framework.info.version}
    url: ${basic-framework.web.admin-ui.url}
    email: ${SWAGGER_EMAIL:opensource@example.com}
    license: ${SWAGGER_LICENSE:MIT}
    license-url: ${SWAGGER_LICENSE_URL:https://example.com/basic-framework/LICENSE}
  sms-code:
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
