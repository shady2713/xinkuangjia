spring:
  application:
    name: basic-framework-server
  config:
    import:
      - optional:file:.env[.properties]        # 工作目录在项目根时
      - optional:file:../.env[.properties]     # IDEA 默认工作目录在 basic-framework-server 模块时
  servlet:
    multipart:
      # 通用文件上传由运行环境和存储容量控制，-1 表示不在 Spring Multipart 层设置固定大小上限。
      max-file-size: -1
      max-request-size: -1
  jackson:
    serialization:
      write-dates-as-timestamps: true
      write-date-timestamps-as-nanoseconds: false
      write-durations-as-timestamps: true
      fail-on-empty-beans: false
  cache:
    type: REDIS
    redis:
      time-to-live: 1h
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_SLAVE_HOST:${DB_HOST:127.0.0.1}}:${DB_SLAVE_PORT:${DB_PORT:3306}}/${DB_SLAVE_NAME:${DB_NAME}}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${DB_SLAVE_USERNAME:${DB_USERNAME}}
          password: ${DB_SLAVE_PASSWORD:${DB_PASSWORD}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:48080}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

logging:
  file:
    name: ${LOG_FILE:logs/basic-framework-server.log}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: NONE
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: ${basic-framework.info.base-package}.module.*.dal.dataobject
  encryptor:
    password: ${MYBATIS_ENCRYPT_PASSWORD:}

mybatis-plus-join:
  banner: false
  sub-table-logic: true
  ms-cache: true
  table-alias: t
  logic-del-type: on

easy-trans:
  is-enable-global: false

aj:
  captcha:
    cache-type: redis
    cache-number: 1000
    timing-clear: 180
    type: blockPuzzle
    aes-status: ${CAPTCHA_AES_STATUS:false}
    water-mark: basic-framework
    interference-options: 0
    req-frequency-limit-enable: false
    req-get-lock-limit: 5
    req-get-lock-seconds: 10
    req-get-minute-limit: 30
    req-check-minute-limit: 60
    req-verify-minute-limit: 60

lock4j:
  acquire-timeout: 3000
  expire: 30000

basic-framework:
  info:
    version: ${APP_VERSION:1.0.0}
    base-package: com.basicframework
  file:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET}
      secure: ${MINIO_SECURE}
      region: ${MINIO_REGION}
      # 对象 URL 按业务要求保持长期公开访问；代码会自动补齐 /{bucket} 路径。
      public-url: ${MINIO_PUBLIC_URL}
  web:
    admin-ui:
      url: ${ADMIN_UI_URL:http://localhost:5175}
  xss:
    enable: true
  security:
    mock-enable: false
    permit-all-urls: []
  captcha:
    enable: true
  access-log:
    enable: true
  api-encrypt:
    enable: ${API_ENCRYPT_ENABLE:false}
    algorithm: ${API_ENCRYPT_ALGORITHM:AES}
    request-key: ${API_ENCRYPT_REQUEST_KEY:}
    response-key: ${API_ENCRYPT_RESPONSE_KEY:}
  swagger:
    title: ${SWAGGER_TITLE:basic-framework API}
    description: ${SWAGGER_DESCRIPTION:Admin and app API documentation}
    author: ${SWAGGER_AUTHOR:李杰}
    version: ${basic-framework.info.version}
    url: ${basic-framework.web.admin-ui.url}
    email: ${SWAGGER_EMAIL:opensource@example.com}
    license: ${SWAGGER_LICENSE:MIT}
    license-url: ${SWAGGER_LICENSE_URL:https://example.com/basic-framework/LICENSE}
  sms-code:
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
