spring:
  application:
    name: basic-framework-server
  config:
    import:
      - optional:file:.env[.properties]        # 工作目录在项目根时
      - optional:file:../.env[.properties]     # IDEA 默认工作目录在 basic-framework-server 模块时
  servlet:
    multipart:
      # 单文件 50MB；请求体 55MB，为 multipart 边界和表单字段预留少量开销。
      # 与前端 nginx.conf 的 client_max_body_size 以及 FileController 的有界读取上限保持一致；
      # 当前容器 Xmx 为 512m，禁止恢复无上限（-1）或盲目放大堆来支撑大文件。
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    serialization:
      write-dates-as-timestamps: true
      write-date-timestamps-as-nanoseconds: false
      write-durations-as-timestamps: true
      fail-on-empty-beans: false
  cache:
    type: REDIS
    redis:
      time-to-live: 1h
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_SLAVE_HOST:${DB_HOST:127.0.0.1}}:${DB_SLAVE_PORT:${DB_PORT:3306}}/${DB_SLAVE_NAME:${DB_NAME}}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${DB_SLAVE_USERNAME:${DB_USERNAME}}
          password: ${DB_SLAVE_PASSWORD:${DB_PASSWORD}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:48080}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

logging:
  file:
    name: ${LOG_FILE:logs/basic-framework-server.log}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: NONE
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: ${basic-framework.info.base-package}.module.*.dal.dataobject
  encryptor:
    password: ${MYBATIS_ENCRYPT_PASSWORD:}

mybatis-plus-join:
  banner: false
  sub-table-logic: true
  ms-cache: true
  table-alias: t
  logic-del-type: on

easy-trans:
  is-enable-global: false

aj:
  captcha:
    cache-type: redis
    cache-number: 1000
    timing-clear: 180
    type: blockPuzzle
    aes-status: ${CAPTCHA_AES_STATUS:false}
    water-mark: basic-framework
    interference-options: 0
    req-frequency-limit-enable: false
    req-get-lock-limit: 5
    req-get-lock-seconds: 10
    req-get-minute-limit: 30
    req-check-minute-limit: 60
    req-verify-minute-limit: 60

lock4j:
  acquire-timeout: 3000
  expire: 30000

basic-framework:
  info:
    version: ${APP_VERSION:1.0.0}
    base-package: com.basicframework
  file:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET}
      secure: ${MINIO_SECURE}
      region: ${MINIO_REGION}
      # 对象 URL 按业务要求保持长期公开访问；代码会自动补齐 /{bucket} 路径。
      public-url: ${MINIO_PUBLIC_URL}
  web:
    admin-ui:
      url: ${ADMIN_UI_URL:http://localhost:5175}
  xss:
    enable: true
  security:
    mock-enable: false
    permit-all-urls: []
    # 密码传输使用 SM2（C1C3C2）。私钥只从环境变量注入，缺失或格式错误时启动失败。
    sm2:
      private-key: ${SM2_PRIVATE_KEY:}
      timestamp-window: ${SM2_TIMESTAMP_WINDOW:5m}
      nonce-ttl: ${SM2_NONCE_TTL:10m}
      replay-check-enabled: ${SM2_REPLAY_CHECK_ENABLED:true}
    # 登录失败锁定：按账号计数，成功登录清零；锁定时返回通用提示。
    login-lock:
      enabled: ${LOGIN_LOCK_ENABLED:true}
      max-failures: ${LOGIN_LOCK_MAX_FAILURES:5}
      lock-duration: ${LOGIN_LOCK_DURATION:30m}
      failure-window: ${LOGIN_LOCK_FAILURE_WINDOW:30m}
    # 短信登录按手机号和 IP 两个维度计数与锁定，提示不区分手机号是否注册。
    sms-login-lock:
      enabled: ${SMS_LOGIN_LOCK_ENABLED:true}
      max-failures: ${SMS_LOGIN_LOCK_MAX_FAILURES:5}
      ip-max-failures: ${SMS_LOGIN_LOCK_IP_MAX_FAILURES:20}
      lock-duration: ${SMS_LOGIN_LOCK_DURATION:30m}
      failure-window: ${SMS_LOGIN_LOCK_FAILURE_WINDOW:30m}
    # 管理后台会话：访问令牌 30 分钟、刷新令牌 30 天，空闲 30 分钟强制失效。
    session:
      idle-timeout: ${SESSION_IDLE_TIMEOUT:30m}
      access-token-validity: ${ACCESS_TOKEN_VALIDITY:30m}
      refresh-token-validity: ${REFRESH_TOKEN_VALIDITY:30d}
    # Redis 不可用时的降级策略：local-fallback（默认，单实例内存兜底）或 fail-closed。
    redis-unavailable-strategy: ${REDIS_UNAVAILABLE_STRATEGY:local-fallback}
  captcha:
    enable: true
  access-log:
    enable: true
  api-encrypt:
    enable: ${API_ENCRYPT_ENABLE:false}
    algorithm: ${API_ENCRYPT_ALGORITHM:AES}
    request-key: ${API_ENCRYPT_REQUEST_KEY:}
    response-key: ${API_ENCRYPT_RESPONSE_KEY:}
  swagger:
    title: ${SWAGGER_TITLE:basic-framework API}
    description: ${SWAGGER_DESCRIPTION:Admin and app API documentation}
    author: ${SWAGGER_AUTHOR:李杰}
    version: ${basic-framework.info.version}
    url: ${basic-framework.web.admin-ui.url}
    email: ${SWAGGER_EMAIL:opensource@example.com}
    license: ${SWAGGER_LICENSE:MIT}
    license-url: ${SWAGGER_LICENSE_URL:https://example.com/basic-framework/LICENSE}
  sms-code:
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
