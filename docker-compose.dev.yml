# 本地开发基础设施栈（仅绑定 127.0.0.1 环回地址，禁止直接用于生产环境）。
# 先运行：python -B -X utf8 scripts/runtime/init_local_dev.py --apply
# 再启动：docker compose --env-file .env.dev -f docker-compose.dev.yml up -d
# MinIO bucket policy: init_local_dev.py --apply writes .e2e-env/minio-bucket-policy.json
# 读取后端 MINIO_PUBLIC_ACCESS 生成策略，minio-init 在 MinIO 就绪后应用。

name: basic-framework-dev

services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-basic_framework}
      MYSQL_USER: ${DB_USERNAME:-basic_dev}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./数据库文件/basic_framework.sql:/docker-entrypoint-initdb.d/01-basic_framework.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    # Local image from pinned official GitHub release binaries (tools/minio/Dockerfile);
    # Docker Hub/Quay MinIO images are unavailable. Shared with minio-init.
    build:
      context: ./tools/minio
    image: localhost/basic-framework-minio:test
    pull_policy: build
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio-init:
    image: localhost/basic-framework-minio:test
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    # Applies the generated anonymous bucket policy (mixed) or clears it (private).
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        target="local/$${MINIO_BUCKET:-basic-framework}"
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "$$target"
        if grep -Fq '"Statement":[]' /policy/bucket-policy.json; then
          mc anonymous set none "$$target"
        else
          mc anonymous set-json /policy/bucket-policy.json "$$target"
        fi
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-basic-framework}
    volumes:
      # Written by: python -B -X utf8 scripts/runtime/init_local_dev.py --apply
      - type: bind
        source: ./.e2e-env/minio-bucket-policy.json
        target: /policy/bucket-policy.json
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

volumes:
  mysql_dev_data:
  redis_dev_data:
  minio_dev_data:
