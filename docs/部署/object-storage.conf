# 在公网 Nginx 的 server 块中引入此对象存储代理片段。
# MinIO 桶策略控制匿名权限，签名请求由 MinIO 校验签名及 IAM 权限。
# 应用网关前先按部署说明使用 apply-bucket-policy.sh 应用桶策略并验证读回。

# 旧公开路径使用同一私有键规则，阻止首段 private 和前导空格的键。
location ~* "^/files/basic-framework/( |private(/| |$))" {
    access_log off;
    error_log /dev/null crit;
    return 404;
}

# 历史公开路径仅代理匿名 GET 和 HEAD。
location /files/basic-framework/ {
    access_log off;
    error_log /dev/null crit;
    limit_except GET {
        deny all;
    }
    # 清除身份请求头及查询参数，再转发匿名请求。
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host basic-framework-minio:9000;
    rewrite ^/files/basic-framework/(.*)$ /basic-framework/$1? break;
    proxy_pass http://basic-framework-minio:9000;
    proxy_hide_header Set-Cookie;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
}

# 保留路径式 SigV4 请求的 URI、原始 Host 和查询，以通过 MinIO 验签。
location /basic-framework/ {
    # 签名查询具有访问权限，因此该位置关闭请求日志和错误日志输出。
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://basic-framework-minio:9000;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    # 与应用 50MB 文件上限对齐，并预留 multipart 封装开销。
    client_max_body_size 55m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Referrer-Policy "no-referrer" always;
}
