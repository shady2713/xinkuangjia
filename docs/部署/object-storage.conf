# Object storage reverse proxy for basic-framework (issue 103).
# Include inside the public nginx `server { ... }` block.
#
# Authorization is enforced by MinIO, not by nginx:
#   - anonymous reads: the bucket policy (authoritative), rendered with
#       python -B -X utf8 scripts/runtime/render_minio_bucket_policy.py --bucket basic-framework --mode mixed
#     and applied with `mc anonymous set-json policy.json ALIAS/basic-framework`;
#     whole-private buckets use `--mode private` / `mc anonymous set none ALIAS/basic-framework`;
#   - signed (SigV4) requests: MinIO IAM policies.

# Defense in depth for the legacy public path: refuse the reserved "private"
# first segment (any letter case) and keys starting with a space. The bucket
# policy denies the same keys for anonymous requests.
location ~* "^/files/basic-framework/( |private(/|$))" {
    return 404;
}

# Legacy publicly readable path, proxied as an anonymous GET/HEAD.
location /files/basic-framework/ {
    access_log off;
    limit_except GET {
        deny all;
    }
    # Drop credentials and the query string so only anonymous access applies.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host basic-framework-minio:9000;
    rewrite ^/files/basic-framework/(.*)$ /basic-framework/$1? break;
    proxy_pass http://basic-framework-minio:9000;
    proxy_hide_header Set-Cookie;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
}

# SigV4 path-style S3 API: forwarded as-is (URI, query, headers) with the
# original Host so signatures verify; MinIO authenticates every request.
location /basic-framework/ {
    # Presigned URLs carry credentials in the query string; never log them.
    access_log off;
    proxy_pass http://basic-framework-minio:9000;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    # 与应用 50MB 文件上限对齐，并预留 multipart 封装开销。
    client_max_body_size 55m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Referrer-Policy "no-referrer" always;
}
