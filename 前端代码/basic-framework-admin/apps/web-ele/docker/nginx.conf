# 仅接纳可信网关覆盖的协议值；直接访问或非法值回退当前连接协议。
map $http_x_forwarded_proto $framework_forwarded_proto {
  default $scheme;
  http http;
  https https;
}

# 外层端口必须是1至65535的十进制数字，其他值回退当前监听端口。
map $http_x_forwarded_port $framework_forwarded_port {
  default $server_port;
  "~^(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$" $http_x_forwarded_port;
}

server {
  listen 80;
  server_name _;
  # 保留外部访问端口，容器不生成带内部端口的绝对重定向。
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;
  # 与当前文件接口配套；正式部署按容量与业务约束调整上传上限。
  client_max_body_size 512m;

  # OAuth2 使用无管理前缀的协议入口；请求参数可能含凭据，禁止访问日志记录 query。
  location /system/oauth2/ {
    access_log off;
    proxy_pass http://basic-framework-backend:48080/system/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $framework_forwarded_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $framework_forwarded_proto;
  }

  # 浏览器运行参数变更后刷新即可生效，避免缓存旧 API 配置。
  # 生产构建以 /admin/ 为资源基础路径，产物 index.html 实际请求 /admin/_app.config.js；
  # 只匹配站点根路径会让该请求落到 location /admin/ 分支而拿不到 no-store，
  # 于是更新配置制品后刷新仍读到旧配置。两条路径必须同样禁止缓存。
  location ~ ^/(?:admin/)?_app\.config\.js$ {
    add_header Cache-Control "no-store";
    rewrite ^/admin/(.*)$ /$1 break;
    try_files $uri =404;
  }

  # 保留管理 API 前缀；Java 容器使用同网络服务名，宿主机 Java 通过 host-gateway 映射。
  location /admin-api/ {
    proxy_pass http://basic-framework-backend:48080/admin-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $framework_forwarded_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $framework_forwarded_proto;
  }

  # 生产构建以 /admin/ 为资源基础路径。
  location = / {
    return 302 /admin/;
  }

  location /admin/ {
    rewrite ^/admin/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # 保留单页应用直达链接；此兜底不增加后端 API 代理。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
