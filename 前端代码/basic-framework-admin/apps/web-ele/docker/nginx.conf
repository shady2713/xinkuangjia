# 仅接纳可信网关覆盖的协议值；直接访问或非法值回退当前连接协议。
map $http_x_forwarded_proto $framework_forwarded_proto {
  default $scheme;
  http http;
  https https;
}

# 外层端口必须是1至65535的十进制数字，其他值回退当前监听端口。
map $http_x_forwarded_port $framework_forwarded_port {
  default $server_port;
  "~^(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$" $http_x_forwarded_port;
}

server {
  # 非特权容器固定监听 8080，由宿主机或外层反向代理映射至 80/443。
  listen 8080;
  server_name _;
  server_tokens off;
  # 保留外部访问端口，容器不生成带内部端口的绝对重定向。
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;
  # 单文件 50MB，请求体 55MB 为 multipart 边界和表单字段预留开销；
  # 与后端 spring.servlet.multipart 及 FileController 的有界读取上限保持一致。
  client_max_body_size 55m;

  # 安全响应头基线（防点击劫持、防 MIME 嗅探、最小化 Referrer 与基础 CSP）。
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'self';" always;

  # OAuth2 使用无管理前缀的协议入口；请求参数可能含凭据，禁止访问日志记录 query。
  location /system/oauth2/ {
    access_log off;
    proxy_pass http://basic-framework-backend:48080/system/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $framework_forwarded_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $framework_forwarded_proto;
  }

  # 浏览器运行参数变更后刷新即可生效，同时覆盖根路径与 /admin/ 生产前缀；重复声明全部安全响应头避免 Nginx 继承覆盖。
  location ~ ^(?:/admin)?/_app\.config\.js$ {
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'self';" always;
    try_files /_app.config.js =404;
  }

  # 保留管理 API 前缀；代理超时与前端上传/下载 120s 超时保持对齐。
  location /admin-api/ {
    proxy_pass http://basic-framework-backend:48080/admin-api/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $framework_forwarded_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $framework_forwarded_proto;
  }

  # 生产构建以 /admin/ 为资源基础路径。
  location = / {
    return 302 /admin/;
  }

  location /admin/ {
    rewrite ^/admin/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # 保留单页应用直达链接；此兜底不增加后端 API 代理。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
