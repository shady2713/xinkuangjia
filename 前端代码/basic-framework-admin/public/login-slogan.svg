<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" fill="none">
  <defs>
    <linearGradient id="heroCardGrad" x1="60" y1="45" x2="360" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#F1F7FF" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="heroBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006BE6" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="heroAreaGrad" x1="160" y1="150" x2="160" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006BE6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#006BE6" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="heroShieldGrad" x1="310" y1="44" x2="382" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006BE6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="heroSoftShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#004499" flood-opacity="0.14" />
    </filter>
    <filter id="heroBadgeShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#006BE6" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 柔和背景轨道光环 -->
  <ellipse cx="210" cy="292" rx="148" ry="22" fill="#006BE6" fill-opacity="0.08" />
  <circle cx="88" cy="72" r="34" fill="#38BDF8" fill-opacity="0.14" />
  <circle cx="348" cy="252" r="42" fill="#006BE6" fill-opacity="0.10" />

  <!-- 主工作台窗口卡片 -->
  <g filter="url(#heroSoftShadow)">
    <rect x="48" y="54" width="306" height="218" rx="16" fill="url(#heroCardGrad)" stroke="#DCE8FA" stroke-width="1.5" />
    <!-- 顶部栏 -->
    <path d="M48 70C48 61.1634 55.1634 54 64 54H338C346.837 54 354 61.1634 354 70V84H48V70Z" fill="#F8FAFC" />
    <line x1="48" y1="84" x2="354" y2="84" stroke="#E5ECF6" stroke-width="1" />
    <circle cx="66" cy="69" r="4" fill="#FCA5A5" />
    <circle cx="80" cy="69" r="4" fill="#FCD34D" />
    <circle cx="94" cy="69" r="4" fill="#6EE7B7" />
    <rect x="118" y="63" width="110" height="12" rx="6" fill="#E6F0FC" />

    <!-- 左侧微型侧边栏骨架 -->
    <rect x="58" y="94" width="54" height="166" rx="10" fill="#F8FAFC" stroke="#EDF2F9" stroke-width="1" />
    <rect x="65" y="104" width="40" height="12" rx="6" fill="url(#heroBlueGrad)" />
    <rect x="65" y="124" width="34" height="8" rx="4" fill="#CBD5E1" />
    <rect x="65" y="140" width="38" height="8" rx="4" fill="#CBD5E1" />
    <rect x="65" y="156" width="28" height="8" rx="4" fill="#E2E8F0" />
    <rect x="65" y="172" width="36" height="8" rx="4" fill="#E2E8F0" />
    <rect x="65" y="232" width="40" height="18" rx="6" fill="#E6F0FC" />

    <!-- 右侧 3 张微型 KPI 卡片 -->
    <rect x="122" y="94" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#E6EEF9" stroke-width="1" />
    <rect x="130" y="103" width="24" height="6" rx="3" fill="#94A3B8" />
    <rect x="130" y="116" width="42" height="11" rx="4" fill="#006BE6" fill-opacity="0.88" />

    <rect x="198" y="94" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#E6EEF9" stroke-width="1" />
    <rect x="206" y="103" width="28" height="6" rx="3" fill="#94A3B8" />
    <rect x="206" y="116" width="36" height="11" rx="4" fill="#0EA5E9" />

    <rect x="274" y="94" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#E6EEF9" stroke-width="1" />
    <rect x="282" y="103" width="22" height="6" rx="3" fill="#94A3B8" />
    <rect x="282" y="116" width="40" height="11" rx="4" fill="#10B981" />

    <!-- 趋势统计主图区 -->
    <rect x="122" y="146" width="220" height="114" rx="10" fill="#FFFFFF" stroke="#E6EEF9" stroke-width="1" />
    <line x1="134" y1="176" x2="330" y2="176" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="134" y1="204" x2="330" y2="204" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="134" y1="232" x2="330" y2="232" stroke="#E2E8F0" stroke-width="1" />

    <!-- 背景柱状条 -->
    <rect x="144" y="206" width="12" height="26" rx="3" fill="#DBEAFE" />
    <rect x="174" y="192" width="12" height="40" rx="3" fill="#BFDBFE" />
    <rect x="204" y="198" width="12" height="34" rx="3" fill="#DBEAFE" />
    <rect x="234" y="180" width="12" height="52" rx="3" fill="#93C5FD" />
    <rect x="264" y="186" width="12" height="46" rx="3" fill="#BFDBFE" />
    <rect x="294" y="168" width="12" height="64" rx="3" fill="#60A5FA" />

    <!-- 渐变折线面积与关键点 -->
    <path d="M138 220 C162 206, 178 184, 204 192 C230 200, 246 168, 274 176 C298 182, 312 162, 326 158 L326 232 L138 232 Z" fill="url(#heroAreaGrad)" />
    <path d="M138 220 C162 206, 178 184, 204 192 C230 200, 246 168, 274 176 C298 182, 312 162, 326 158" stroke="#006BE6" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <circle cx="204" cy="192" r="4" fill="#FFFFFF" stroke="#006BE6" stroke-width="2.5" />
    <circle cx="274" cy="176" r="4" fill="#FFFFFF" stroke="#006BE6" stroke-width="2.5" />
    <circle cx="326" cy="158" r="4.5" fill="#006BE6" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- 右上角浮动安全合规盾牌徽章 -->
  <g filter="url(#heroBadgeShadow)">
    <rect x="314" y="34" width="66" height="66" rx="18" fill="url(#heroShieldGrad)" />
    <path d="M347 47L363 53.5V65.5C363 75.5 356.1 83.2 347 86.5C337.9 83.2 331 75.5 331 65.5V53.5L347 47Z" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <path d="M341 66.5L345.2 70.7L353.8 62.1" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 左下角浮动权限隔离胶囊卡 -->
  <g filter="url(#heroBadgeShadow)">
    <rect x="26" y="216" width="128" height="48" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" />
    <circle cx="48" cy="240" r="12" fill="#E6F0FC" />
    <path d="M44 240H52M48 236V244" stroke="#006BE6" stroke-width="2" stroke-linecap="round" />
    <rect x="68" y="230" width="66" height="7" rx="3.5" fill="#1E293B" fill-opacity="0.82" />
    <rect x="68" y="243" width="46" height="6" rx="3" fill="#94A3B8" />
  </g>
</svg>
