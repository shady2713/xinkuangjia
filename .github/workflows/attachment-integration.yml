name: attachment-integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-attachment-it:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_NAME: issue103_fixture
      DB_SLAVE_NAME: issue103_fixture
      DB_SLAVE_HOST: 127.0.0.1
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      MINIO_ENDPOINT: http://127.0.0.1:19000
      MINIO_SIGNING_ENDPOINT: http://127.0.0.1:18081
      MINIO_PUBLIC_URL: http://127.0.0.1:18081/files
      RUN_REAL_ATTACHMENT_IT: "true"
      SPRING_PROFILES_ACTIVE: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 初始化脚本检查开发工具是否存在。
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false
      - name: Initialize gitignored env files with random values
        run: python -B -X utf8 scripts/runtime/init_local_dev.py --apply
      - name: Run RealAttachmentServiceIT
        id: test
        env:
          COMPOSE_PROJECT_NAME: issue103
        run: |
          src=docs/部署/object-storage.conf
          conf="$RUNNER_TEMP/issue103-nginx.conf"
          grep -q 'basic-framework-minio' "$src"
          # 复用部署网关配置，指向本作业的 Compose 上游。
          { printf 'server {\n  listen 8080;\n'; sed 's/basic-framework-minio/minio/g' "$src"; printf '}\n'; } > "$conf"
          if grep -q 'basic-framework-minio' "$conf"; then exit 1; fi
          # 网关和后端测试在桶策略读回成功后才启动，继承核验过的桶配置。
          sh scripts/runtime/start_dev_stack.sh -- sh -eu -c '
            docker run -d --name issue103-nginx --network issue103_default -p 127.0.0.1:18081:8080 -v "$1:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
            docker exec issue103-nginx nginx -t
            cd "$2"
            exec mvn -B -ntp -pl basic-framework-server -am -Dtest=RealAttachmentServiceIT -Dsurefire.failIfNoSpecifiedTests=false test
          ' sh "$conf" "$GITHUB_WORKSPACE/后端代码/basic-framework-boot"
      - name: Write sanitized summary
        id: summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SUMMARY_PATH: ${{ runner.temp }}/attachment-integration-summary.json
        run: |
          python -I -B -X utf8 - <<'PY'
          import glob, json, os, subprocess, xml.etree.ElementTree as ET
          e = os.environ
          def first(*cmd):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
                  out = (r.stdout + r.stderr).strip().splitlines()
                  return out[0].strip()[:200] if r.returncode == 0 and out else None
              except Exception:
                  return None
          def svc(name, *cmd):
              cid = first("docker", "ps", "-q", "--filter", "label=com.docker.compose.project=issue103", "--filter", f"label=com.docker.compose.service={name}")
              return first("docker", "exec", cid, *cmd) if cid else None
          versions = {s: svc(s, *c.split()) for s, c in (("mysql", "mysqld --version"), ("redis", "redis-server --version"), ("minio", "minio --version"))}
          versions["nginx"] = first("docker", "exec", "issue103-nginx", "nginx", "-v")
          t, ok = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}, True
          for f in glob.glob("后端代码/basic-framework-boot/**/target/surefire-reports/TEST-*RealAttachmentServiceIT.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
                  for k in t: t[k] += int(root.get(k, "0"))
              except Exception:
                  ok = False
          o = e.get("TEST_OUTCOME") or "skipped"
          checkout = first("git", "rev-parse", "HEAD")
          parents = first("git", "rev-list", "--parents", "-n", "1", "HEAD") or ""
          version_ok = all(versions.values()) and checkout and checkout == e.get("GITHUB_SHA")
          if e.get("GITHUB_EVENT_NAME") == "pull_request":
              version_ok = version_ok and parents.split()[1:] == [e.get("PR_BASE"), e.get("PR_HEAD")]
          gate = bool(version_ok) and ok and t["tests"] == 1 and t["failures"] == t["errors"] == t["skipped"] == 0
          gate = gate and o == "success" and e.get("JOB_STATUS") == "success"
          if gate: conclusion = "success"
          elif e.get("JOB_STATUS") == "cancelled": conclusion = "cancelled"
          else: conclusion = "skipped" if o == "skipped" else "failure"
          pr_number = e.get("PR_NUMBER", "")
          summary = {"tested_sha": checkout,
                     "repository": e.get("GITHUB_REPOSITORY"), "workflow_ref": e.get("GITHUB_WORKFLOW_REF"),
                     "pr_number": int(pr_number) if pr_number.isdecimal() else None,
                     "pr_head_sha": e.get("PR_HEAD") or None, "pr_base_sha": e.get("PR_BASE") or None,
                     "run_id": e.get("GITHUB_RUN_ID"), "run_attempt": e.get("GITHUB_RUN_ATTEMPT"),
                     "event_name": e.get("GITHUB_EVENT_NAME"), "test_outcome": o, "conclusion": conclusion, "gate_passed": gate,
                     "service_versions": versions, "surefire": t}
          with open(e["SUMMARY_PATH"], "w", encoding="utf-8") as fh:
              json.dump(summary, fh, indent=2, sort_keys=True)
          with open(e["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"conclusion={conclusion}\n")
          PY
      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attachment-integration-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attachment-integration-summary.json
          if-no-files-found: error
      - name: Clean up scoped Nginx and Compose resources
        if: always()
        run: |
          docker rm -f issue103-nginx >/dev/null 2>&1 || true
          ef=(); [ -f .env.dev ] && ef=(--env-file .env.dev)
          docker compose -f docker-compose.dev.yml "${ef[@]}" --project-name issue103 down -v --remove-orphans || true
          rm -f "$RUNNER_TEMP/issue103-nginx.conf"
      - name: Enforce exactly one successful test without skips
        if: always()
        env:
          CONCLUSION: ${{ steps.summary.outputs.conclusion }}
        run: test "$CONCLUSION" = success
