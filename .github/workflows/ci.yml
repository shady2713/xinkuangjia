name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Maven quality-gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 后端代码/basic-framework-boot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: 后端代码/basic-framework-boot/**/pom.xml
      - name: Maven quality-gate verify
        run: mvn -B -ntp -Pquality-gate verify

  frontend:
    name: frontend (unit + typecheck + lint + build)
    runs-on: ubuntu-latest
    env:
      # GitHub runner 默认 TZ=UTC；仓库时区相关单测期望 IANA 区域名（如 Asia/Shanghai）。
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: 前端代码/basic-framework-admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: 前端代码/basic-framework-admin/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Shared frontend quality, test, build and security gates
        run: pnpm run quality:gates
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('前端代码/basic-framework-admin/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Critical browser E2E path (production preview)
        run: pnpm run test:e2e:ci
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ci-results
          path: 前端代码/basic-framework-admin/apps/web-ele/test-results
          retention-days: 7
          if-no-files-found: ignore

  docs-comments:
    name: docs + comments
    runs-on: ubuntu-latest
    env:
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install quality tooling
        run: python -m pip install -r tools/quality/requirements.txt
      - name: Resolve comparison baseline
        id: baseline
        shell: bash
        run: python -B -X utf8 scripts/workflow/resolve_ci_baseline.py
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: 前端代码/basic-framework-admin/pnpm-lock.yaml
      - name: Install web parser
        working-directory: 前端代码/basic-framework-admin
        run: pnpm install --frozen-lockfile
      - name: Docs checks (with mermaid)
        run: |
          set -euo pipefail
          python -B -X utf8 scripts/workflow/run_checks.py --group docs
      - name: Comments checks
        run: |
          set -euo pipefail
          python -B -X utf8 scripts/workflow/run_checks.py --group comments --base "${{ steps.baseline.outputs.sha }}"
      - name: PR slice size guard
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          MERGE_BASE="$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || echo "$BASE_SHA")"
          ADDED_LINES="$(git diff --numstat "$MERGE_BASE" HEAD -- . \
            ':!pnpm-lock.yaml' \
            ':!*/pnpm-lock.yaml' \
            ':!*/openapi.json' \
            ':!*/api-types.d.ts' \
            ':!docs/开发指南/模块依赖关系图.md' \
            | awk '$1 ~ /^[0-9]+$/ { sum += $1 } END { print sum + 0 }')"
          echo "Non-generated PR added lines: $ADDED_LINES"
          HAS_SLICE_OVERRIDE=0
          if printf '%s\n' "${PR_BODY:-}" | tr -d '\r' | grep -Eq '^[[:space:]]*\[slice-override\][[:space:]]*:[[:space:]]*[^[:space:]].*$'; then
            HAS_SLICE_OVERRIDE=1
          fi
          if [ "$ADDED_LINES" -gt 600 ] && [ "$HAS_SLICE_OVERRIDE" -ne 1 ]; then
            echo "PR non-generated additions ($ADDED_LINES lines) exceed 600-line slice budget; split into smaller PRs or add a standalone '[slice-override]: <rationale>' line in PR body." >&2
            exit 1
          fi

  pytest:
    name: pytest (scripts/tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: 前端代码/basic-framework-admin/pnpm-lock.yaml
      - name: Install quality tooling
        run: python -m pip install -r tools/quality/requirements.txt
      - name: Install web parser
        working-directory: 前端代码/basic-framework-admin
        run: pnpm install --frozen-lockfile
      - name: Pytest tooling tests
        run: python -B -X utf8 -m pytest scripts/tests

  secrets-scan:
    name: secrets scan (staged-equivalent)
    runs-on: ubuntu-latest
    env:
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve comparison baseline
        id: baseline
        shell: bash
        run: python -B -X utf8 scripts/workflow/resolve_ci_baseline.py
      - name: Scan changed files for secrets
        run: |
          set -euo pipefail
          # 脚本只扫 git 暂存区，不接受文件路径参数。
          BASE="${{ steps.baseline.outputs.sha }}"
          if [ -z "$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)" ]; then
            echo "No changed files to scan."
            exit 0
          fi
          # 索引对齐到 BASE，工作区保持 HEAD，再 add 全部差异，等价于扫本次变更。
          git reset --mixed "$BASE"
          git add -A
          python -B -X utf8 scripts/security/scan_staged_secrets.py
