# basic-framework CI 门禁。
#
# 重要状态（维护者必读，勿据此推断 CI 曾经通过）：
#   1. 本文件已在云端真实运行过：提交 36da1d3 的 run 37187078778 结论为 failure，
#      docs_tools、backend、frontend、browser_e2e 与门禁汇总全部红灯，原因见下面各条。
#   2. 本轮修复只在本机 Linux 验证到依赖与命令层：docs_tools 的检查在干净环境中缺依赖时
#      退出 2、补齐锁定依赖后退出 0；ci_services.py 的镜像预检与 MinIO 容器在本机真实 Docker
#      上拉取并启动通过。云端 runner 行为要等下一次真实运行确认，本文件不据此声明通过。
#   3. MinIO 上游已不再提供匿名可拉取的官方镜像（Docker Hub 的 minio/minio 与 quay.io 均拒绝
#      匿名访问，dl.min.io 官方端点返回 410），因此 ci_services.py 内置了经本机拉取、按
#      `server /data` 启动并校验 /minio/health/ready 的摘要固定默认值，同时保留
#      BF_CI_IMAGE_MINIO 覆盖。默认值与覆盖值都必须按 sha256 固定：预检步骤
#      `ci_services.py images` 在启动容器前拒绝缺失或未固定的来源，不做任何降级。
#   4. docs_tools 的 md-links、doc-refs、doc-structure、doc-policy、mermaid、skills 等检查需要
#      markdown-it-py 与 PyYAML，两者都锁定在 scripts/workflow/requirements-ci.txt 并由该作业
#      自己安装；不能依赖其他作业的 pip 环境，也不能只装在一处。
#   5. 发布阶段的前端覆盖率裁决调用 coverage_declarations.mjs，该脚本用 readFileSync(0)
#      读取完整源码清单。本机 Linux（Node 24.15.0）实测：清单超过管道缓冲时间歇报
#      EAGAIN，裁决以环境错误退出 2 红灯；修复位置在前端桥接脚本，本次未改，云端未验证。
#   6. 浏览器业务端到端（browser_e2e）在 runner 内真实构建前后端、创建随机隔离库与种子
#      管理员并执行 Playwright 用例。缺少 Chromium 或任何一步环境失败都会让作业红灯，
#      没有跳过或忽略分支。
#   7. 36da1d3 的云端前端单元测试退出 1，失败用例写入 runner 临时 JSON 却没有上传，无法定位。
#      现在四个作业都用 if: always() 上传本次真实产出的测试摘要与必要日志，重跑后可据此
#      定位真实失败用例；上传步骤不改变作业结论，也不把失败包装成通过。
#   8. 全量 Java 注释检查当前仍有已登记阻断（D15 核对版本 162 个 public/嵌套类型，落在
#      157 个文件；严格模式退出 1）。docs_tools 的注释步骤改以 D15 §78 的显式维护模式运行：
#      合规登记的未验收项移入独立阻断清单、作业可以 success，同时真实写出
#      source-acceptance-report/v1。这不构成发布通过：release 汇总必须独立取回并复核该报告，
#      存在适用阻断时仍退出 1、release_verified=false（D15 §80/§99）。是否已在本机之外的
#      云端按此配置真实跑通，以该次运行结论为准，本文件不据此声明通过。
#
# 门禁语义（与 scripts/workflow/ci_gate.py 的强制规则一致）：
#   * docs_tools、backend、frontend、browser_e2e 四个作业都是必需作业，必须 result == success。
#   * skipped、cancelled、failure 一律不算通过；零用例、空报告同样不算通过。
#   * 每个作业只能上报本阶段的真实计数；阶段由 workflow_dispatch 的 stage 输入决定。
#   * 各阶段执行的真实检查不同：functional 与 audit 跑测试并通过 JUnit 报告门禁；
#     release 还必须产出发布阶段的覆盖率裁决（逐文件行与方法/函数 100%）和完整前端验证。
#   * release 结论必须有真实证据：aggregate 要求取回 release-backend.json /
#     release-frontend.json 与 coverage-backend.json / coverage-web.json，文件缺失、零对象、
#     审计阶段结论、阈值被改或计数与作业上报不一致一律拒绝。阶段标签本身不产生发布结论。
#   * frontend 作业在 release 阶段还要真实执行 Web 全量注释检查，把本次实测对象数写进
#     release-frontend.json；aggregate 按 own_count 独立复算受管 Web 源码范围，缺项、
#     未通过、零对象或计数与实测范围不符一律拒绝（docs_tools 里的那次执行不进入发布制品）。
#   * release 还必须取回 docs_tools 真实写出的来源验收报告
#     （$RUNNER_TEMP/release-evidence/source-acceptance-report.json，schema
#     source-acceptance-report/v1）：报告缺失、未知 schema、旧提交、规则实现指纹或受控账本
#     指纹不符、扫描范围漏项、计数与逐项清单不符、或存在适用来源阻断（含合规登记的阻断）
#     时，汇总退出 1 且 release_verified=false；四个必需作业全绿不能代替本次来源验收。
#   9. run 37739234202（SHA 64eedb7）首次真实跑起性能门禁：耗时 402.1s、10 个场景全部实测，
#      但日志只留下「判定退出码 1；报告目录 …/perf-baseline」，逐条 findings 只写在该临时
#      目录下的 verdict.json；作业判红后发布证据上传被跳过，该目录也不再保留 ⇒ 事后无法
#      判断失败类别。现在 run_baseline.py 自身把逐条 findings 回显到 stdout，性能实查步骤
#      无论成败都归档并回显 verdict.json、再以 `if: always()` 上传，退出码仍按原始退出码。
#  10. run 37745930988 之后仍有第二个缺口：下载该次运行的全部 9 个 artifact 后，
#      `merged.json` / `latency.json` / `sql.json` 命中数为 0——原始报告从未作为制品上传。
#      verdict.json 只给出逐条 findings，判定只用报告里的统计量；没有原始报告，事后对
#      **未触发 finding** 的指标只能按判定式严格反推成**右删失上界**，拿不到 CI 侧真实的
#      分位数分布与 samples_ms 原始样本。现在原始报告目录同样以 `if: always()` 上传，
#      退出码、阈值与判定逻辑一律未动。
name: ci-gate

on:
  push:
    branches:
      - codex/framework-remediation
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: 本次验证阶段；发布结论只能由 release 阶段给出
        required: true
        default: audit
        type: choice
        options:
          - functional
          - audit
          - release

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  docs_tools:
    name: 文档与工具检查
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      checked: ${{ steps.count.outputs.checked }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A1（E1-author-only）来源契约要读取**整改前基线提交**的文件字节来复算
          # 「排除本地 @author 声明后与上游逐行全等」。浅克隆（默认 fetch-depth: 1）
          # 取不到该基线提交，检查器会把「取不回基线」说成「内容不符」。
          # 因此本作业需要完整历史；其余作业不依赖历史，保持默认深度。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 文档检查自身就消费 markdown-it-py 与 PyYAML：本作业必须自己安装锁定依赖，
      # 只靠其他作业安装 requirements-ci.txt 不会进入本作业的运行环境。
      - name: 安装固定版本的 CI 工具依赖
        run: python -m pip install --require-hashes -r scripts/workflow/requirements-ci.txt

      # Web 全量注释子检查（web-comments-full）通过 Node 解析器读取前端源码，必须有
      # 与管理前端测试作业一致的固定 Node 版本；此前本作业只用 corepack，依赖运行器
      # 预装的 Node。缺少 Node 或前端依赖时检查按环境错误退出 2，不会因为没装环境
      # 而被记成通过。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 文档检查里的 Mermaid 解析使用管理前端已安装依赖，与本地要求一致。
      - name: 安装管理前端依赖
        working-directory: 前端代码/basic-framework-admin
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: 运行已登记质量检查
        run: |
          python -B -X utf8 scripts/workflow/run_checks.py --group docs --json \
            --report "$RUNNER_TEMP/docs-report.json"

      - name: 复核证据
        run: |
          python -B -X utf8 scripts/workflow/verify_report.py "$RUNNER_TEMP/docs-report.json" --json

      # 边界与契约检查器是纯 Python 静态检查，已登记在 run_checks.py 的 boundaries 组，
      # 但在本次改动前从未接入任何作业，属于"已登记却没真正运行"。这里显式运行并复核报告：
      # 违规、零对象、报告缺失都会让本作业红灯，汇总门禁随即拒绝，不会静默通过。
      # 不写进上面的 checked 计数：该计数只表示文档与工具检查对象数，混入其他范围会失真。
      - name: 运行边界与契约检查
        run: |
          python -B -X utf8 scripts/workflow/run_checks.py --group boundaries --json \
            --report "$RUNNER_TEMP/boundaries-report.json"
          python -B -X utf8 scripts/workflow/verify_report.py "$RUNNER_TEMP/boundaries-report.json" --json
          python -B -X utf8 - <<'PY'
          import json, os, sys
          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          passed = [item for item in report["results"] if item.get("status") == "passed"]
          total = sum(int(item["checked"]) for item in passed)
          if total <= 0:
              sys.exit("边界与契约检查没有任何实际对象，不计为通过")
          print(f"边界与契约检查对象：{total}")
          PY
        env:
          REPORT: ${{ runner.temp }}/boundaries-report.json

      - name: 上传边界与契约检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundaries-report
          path: ${{ runner.temp }}/boundaries-report.json
          if-no-files-found: warn
          retention-days: 7

      # 注释检查器同样已登记在 run_checks.py 的 comments 组（全量 Java 注释、全量 Web
      # 注释与增量 Java/Web/Python 注释），但在本次改动前从未接入任何作业，属于"已登记却没真正运行"。
      # 这里显式运行并复核报告：全量 Java 注释欠账、Web 全量注释欠账、零对象、报告缺失都会让本作业红灯，
      # 汇总门禁随即拒绝，不会静默通过。
      # 不写进上面的 checked 计数：该计数只表示文档与工具检查对象数，混入其他范围会失真。
      - name: 运行注释检查
        env:
          REPORT: ${{ runner.temp }}/comments-report.json
          ACCEPTANCE_REPORT: ${{ runner.temp }}/release-evidence/source-acceptance-report.json
        run: |
          mkdir -p "$(dirname "$ACCEPTANCE_REPORT")"
          # 全量 Java 注释检查在无受控快照时需按固定提交地址实时取回上游内容并复算
          # SHA-256（实测单项约 128 秒，云端更慢），默认 180 秒余量不足，故显式放宽
          # 单项超时；这不改变任何判定标准，超时仍按 environment-error 让本作业红灯。
          #
          # --maintenance 是裁决 D15 §78 的显式维护模式：只有合规登记的未验收项（就地
          # 验收标注与索引相符、登记完整、对象与最终版本可核对）才移入独立阻断清单，全量
          # 检查以 completed-with-registered-blockers 结束，并真实写出 source-acceptance-report/v1；
          # 缺标注、登记/指纹/范围不符等硬失败仍然退出 1，本作业随之红灯，这里没有
          # continue-on-error 或吞掉失败的分支。发布是否成立不由本步骤决定：release 汇总
          # 必须独立取回该报告并复核，存在适用阻断时仍退出 1、release_verified=false
          # （D15 §80/§99），因此维护模式不会把发布包装成通过。
          python -B -X utf8 scripts/workflow/run_checks.py --group comments --maintenance --timeout 600 --json \
            --report "$RUNNER_TEMP/comments-report.json" \
            --acceptance-report "$ACCEPTANCE_REPORT"
          python -B -X utf8 scripts/workflow/verify_report.py "$RUNNER_TEMP/comments-report.json" --json
          python -B -X utf8 - <<'PY'
          import json, os, sys
          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          # Web 全量注释是「全库注释合格」的唯一依据：本次运行必须真的执行过它，
          # 并且给出正整数的实测对象数。缺项、未通过或零对象一律让本作业红灯，
          # 不能因为 comments 组的其他检查通过就把全量范围当成已覆盖。
          full = next(
              (item for item in report["results"] if item.get("name") == "web-comments-full"),
              None,
          )
          if full is None:
              sys.exit("注释检查没有执行 Web 全量注释子检查")
          if full.get("status") != "passed":
              sys.exit(f"Web 全量注释子检查未真实通过：{full.get('status')}")
          if type(full.get("checked")) is not int or full["checked"] <= 0:
              sys.exit("Web 全量注释子检查没有正整数的实测对象数")
          # 有实际对象的真实执行包括通过项与维护完成态；维护完成态计入“执行过”，
          # 但不计入通过数（counts.passed），也不代表来源验收通过。
          executed = [
              item for item in report["results"]
              if item.get("status") in ("passed", "completed-with-registered-blockers")
          ]
          total = sum(int(item["checked"]) for item in executed)
          if total <= 0:
              sys.exit("注释检查没有任何实际对象，不计为通过")
          print(
              f"注释检查对象：{total}（其中 Web 全量注释 {full['checked']} 个）；"
              f"已登记阻断 {report['counts']['registered_blockers']} 项，不计为通过"
          )
          PY

      - name: 上传注释检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-report
          path: ${{ runner.temp }}/comments-report.json
          if-no-files-found: warn
          retention-days: 7

      # 来源验收报告是 release 汇总必须独立复核的制品（D15 §69）：生产端由上面的全量
      # Java 注释检查真实写出，这里无论成败都取回。缺失时只用 warn 记录而不额外失败，
      # 因为 release 汇总本身把“没有本次报告”当作受控失败，不会出现缺报告仍然发布通过。
      - name: 上传来源验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-source
          path: ${{ runner.temp }}/release-evidence/source-acceptance-report.json
          if-no-files-found: warn
          retention-days: 7

      # 失败也要留下真实报告：$RUNNER_TEMP/docs-report.json 由上面的 run_checks.py 实际写出，
      # 记录每项检查的真实状态与诊断。依赖安装等更早的失败会让该文件不存在，此时只用
      # warn 记录缺文件，不改变作业结论，也不把失败包装成通过。
      - name: 上传文档与工具检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-tools-report
          path: ${{ runner.temp }}/docs-report.json
          if-no-files-found: warn
          retention-days: 7

      # 只统计真实通过检查的对象数；零对象必须失败，不能用空报告冒充通过。
      # 输出文件必须取 runner 注入的 GITHUB_OUTPUT 环境变量：不存在的 context 属性会
      # 解析为空字符串，open("") 直接失败，检查通过也写不出真实计数。
      - name: 汇总真实检查对象
        id: count
        env:
          REPORT: ${{ runner.temp }}/docs-report.json
        run: |
          python -B -X utf8 - <<'PY'
          import json, os, sys
          output = os.environ.get("GITHUB_OUTPUT")
          if not output:
              sys.exit("缺少 GITHUB_OUTPUT：无法上报本次真实检查对象数")
          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          passed = [item for item in report["results"] if item.get("status") == "passed"]
          total = sum(int(item["checked"]) for item in passed)
          if total <= 0:
              sys.exit("没有任何实际检查对象，docs_tools 不计为通过")
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"checked={total}\n")
          PY

      - id: stage
        env:
          STAGE: ${{ inputs.stage || 'audit' }}
        run: printf 'stage=%s\n' "$STAGE" >> "$GITHUB_OUTPUT"

  frontend:
    name: 管理前端测试
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      checked: ${{ steps.count.outputs.checked }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 前端代码/basic-framework-admin/pnpm-lock.yaml

      - name: 安装管理前端依赖
        working-directory: 前端代码/basic-framework-admin
        run: pnpm install --frozen-lockfile

      # functional 与 audit 阶段：真实单元测试加 JSON 报告；退出码仍由 pnpm 原样传递，
      # 失败不会被报告文件掩盖。
      - name: 运行单元测试并产出 JSON 报告
        if: inputs.stage != 'release'
        id: vitest
        working-directory: 前端代码/basic-framework-admin
        env:
          REPORT: ${{ runner.temp }}/frontend-vitest.json
        run: |
          set +e
          pnpm test:unit --reporter=json --outputFile="$REPORT"
          status=$?
          set -e
          test -s "$REPORT" || { echo "前端没有产出 JSON 测试报告"; exit 1; }
          exit $status

      # release 阶段：同一次测试同时采集覆盖率，供后面的发布阶段裁决使用；用例数仍由
      # JSON 报告提供，因此汇总步骤不依赖报告之外的任何声明。
      - name: 运行单元测试并采集覆盖率
        if: inputs.stage == 'release'
        id: vitest_coverage
        working-directory: 前端代码/basic-framework-admin
        env:
          REPORT: ${{ runner.temp }}/frontend-vitest.json
        run: |
          set +e
          pnpm test:coverage -- --reporter=json --outputFile="$REPORT"
          status=$?
          set -e
          test -s "$REPORT" || { echo "前端没有产出 JSON 测试报告"; exit 1; }
          exit $status

      # 前端失败原因只存在于这份 JSON 报告里：无论用例成败都用 if: always() 取回，
      # 路径就是上面 vitest 步骤真实写入的 $RUNNER_TEMP/frontend-vitest.json。
      # 依赖安装等更早的失败会让文件不存在，此时用 warn 记录而不改变作业结论。
      - name: 上传前端测试摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-report
          path: ${{ runner.temp }}/frontend-vitest.json
          if-no-files-found: warn
          retention-days: 7

      - name: 汇总真实用例数
        id: count
        env:
          REPORT: ${{ runner.temp }}/frontend-vitest.json
        run: |
          python -B -X utf8 - <<'PY'
          import json, os, sys
          output = os.environ.get("GITHUB_OUTPUT")
          if not output:
              sys.exit("缺少 GITHUB_OUTPUT：无法上报本次真实用例数")
          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          total = int(report["numTotalTests"])
          failed = int(report["numFailedTests"])
          if total <= 0:
              sys.exit("前端没有实际用例，frontend 不计为通过")
          if failed or not report.get("success"):
              sys.exit(f"前端存在 {failed} 个失败用例，frontend 不计为通过")
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"checked={total}\n")
          PY

      - id: stage
        env:
          STAGE: ${{ inputs.stage || 'audit' }}
        run: printf 'stage=%s\n' "$STAGE" >> "$GITHUB_OUTPUT"

      # 以下只属于 release：完整前端验证的每一步失败都会让 frontend 作业失败，
      # 聚合门禁随即拒绝发布，不会出现“只换标签”的发布通过。
      - name: 类型检查（发布阶段）
        if: inputs.stage == 'release'
        working-directory: 前端代码/basic-framework-admin
        run: pnpm check:type

      - name: 生产构建（发布阶段）
        if: inputs.stage == 'release'
        working-directory: 前端代码/basic-framework-admin
        run: pnpm build:ele

      - name: 生产产物配置扫描（发布阶段）
        if: inputs.stage == 'release'
        working-directory: 前端代码/basic-framework-admin
        run: pnpm quality:prod-scan

      # 第三方许可材料按产物字节实查：材料必须真的在产物里，条目数必须与本次构建
      # 分块实际引用的包集合一致，任一不符都让作业失败。门禁不生成也不补写材料，
      # 缺材料只能由上面的生产构建补齐，缺失时这里如实红灯。
      - name: 发布阶段前端许可材料实查
        if: inputs.stage == 'release'
        env:
          LICENSE_GATE: ${{ runner.temp }}/release-evidence/license-web.json
        run: |
          mkdir -p "$(dirname "$LICENSE_GATE")"
          python -B -X utf8 \
            前端代码/basic-framework-admin/scripts/quality/license_materials_gate.py \
            --root 前端代码/basic-framework-admin --json > "$LICENSE_GATE"
          cat "$LICENSE_GATE"

      # 发布阶段必须真实执行完整前端静态检查（ESLint、Prettier、Stylelint）并写出证据：
      # 下面的覆盖率裁决会复核该证据，缺失、跳过或任何违规都会让作业失败，不会静默通过。
      - name: 完整静态检查（发布阶段）
        if: inputs.stage == 'release'
        working-directory: 前端代码/basic-framework-admin
        run: python -B -X utf8 ../../scripts/workflow/static_gate.py --kind web --execute

      # 全库 Web 注释合格只有这一个依据：docs_tools 作业里的那次执行不进入发布制品，
      # 换阶段或换标签都看不到它。发布阶段因此在这里重新真实执行全量入口，退出码原样
      # 传递（零对象按环境错误退出 2，检查失败退出 1），没有任何跳过或忽略分支；
      # 实测对象数由下面的证据生成步骤直接读回本次 JSON，写进 release-frontend.json。
      - name: Web 全量注释（发布阶段）
        if: inputs.stage == 'release'
        env:
          WEB_COMMENTS: ${{ runner.temp }}/web-comments-full.json
        run: |
          python -B -X utf8 scripts/code/web/check_full_web_comments.py --root . --json \
            > "$WEB_COMMENTS"
          cat "$WEB_COMMENTS"

      # 发布门槛由覆盖率先按可读方式裁决：未达标时日志直接给出缺口，不写出任何证据；
      # 只有真实通过才再产出机器证据，避免把失败或审计结论写成发布证据。
      - name: 发布阶段前端覆盖率裁决
        if: inputs.stage == 'release'
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence
        run: |
          mkdir -p "$EVIDENCE"
          python -B -X utf8 scripts/workflow/coverage_gate.py --kind web --stage release
          python -B -X utf8 scripts/workflow/coverage_gate.py --kind web --stage release --json \
            > "$EVIDENCE/coverage-web.json"

      # 证据清单绑定本次提交，并声明每条真实检查与其可核对命令；计数取自上面的
      # 报告门禁输出，门禁汇总会与作业上报的计数、覆盖率裁决的实测文件数交叉核对。
      - name: 生成发布阶段前端证据
        if: inputs.stage == 'release'
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence
          REVISION: ${{ github.sha }}
          UNIT_CASES: ${{ steps.count.outputs.checked }}
          WEB_COMMENTS: ${{ runner.temp }}/web-comments-full.json
        run: |
          python -B -X utf8 - <<'PY'
          import json, os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE"])
          coverage = json.loads((evidence / "coverage-web.json").read_text(encoding="utf-8"))
          # Web 全量注释的计数必须取自上一步真实执行的 JSON：这里重新读一遍状态与实测
          # 对象数，不在本步骤内重新编造数字；缺文件、状态非 passed 或非正整数都让
          # 本作业失败，汇总门禁随后按 RELEASE_CHECKS 的 own_count 独立复算受管范围。
          web_comments = json.loads(Path(os.environ["WEB_COMMENTS"]).read_text(encoding="utf-8"))
          if web_comments.get("status") != "passed" or web_comments.get("findings"):
              raise SystemExit(f"Web 全量注释未真实通过：{web_comments.get('status')}")
          web_checked = web_comments.get("checked")
          if type(web_checked) is not int or web_checked <= 0:
              raise SystemExit("Web 全量注释没有正整数的实测对象数")
          # 许可材料实查的读数同样取自上一步门禁真实写出的 JSON：只复核状态，
          # 条数不在本步骤内重新计算，缺文件或状态非 passed 都让作业失败。
          license_gate = json.loads(
              (evidence / "license-web.json").read_text(encoding="utf-8"))
          if license_gate.get("status") != "passed" or license_gate.get("checks") is None:
              raise SystemExit("前端许可材料实查未真实通过")
          document = {
              "schema": "ci-release-evidence/v1",
              "job": "frontend",
              "stage": "release",
              "revision": os.environ["REVISION"],
              "checks": [
                  {"name": "frontend-unit-tests", "status": "passed", "checked": int(os.environ["UNIT_CASES"]),
                   "command": "pnpm test:coverage -- --reporter=json --outputFile=..."},
                  {"name": "frontend-release-coverage", "status": "passed", "checked": coverage["measured_files"],
                   "command": "python -B -X utf8 scripts/workflow/coverage_gate.py --kind web --stage release --json"},
                  {"name": "frontend-typecheck", "status": "passed", "checked": None,
                   "command": "pnpm check:type"},
                  {"name": "frontend-production-build", "status": "passed", "checked": None,
                   "command": "pnpm build:ele"},
                  {"name": "frontend-production-scan", "status": "passed", "checked": None,
                   "command": "pnpm quality:prod-scan"},
                  {"name": "web-comments-full", "status": "passed", "checked": web_checked,
                   "command": "python -B -X utf8 scripts/code/web/check_full_web_comments.py --root . --json"},
                  # 该检查按产物字节裁决，没有可与用例数比对的第二份声明，声明 null。
                  {"name": "frontend-license-materials", "status": "passed", "checked": None,
                   "command": "python -B -X utf8 前端代码/basic-framework-admin/scripts/quality/license_materials_gate.py --root 前端代码/basic-framework-admin --json"},
              ],
              "coverage": {"kind": "web", "evidence": "coverage-web.json", "stage": "release",
                           "measured_files": coverage["measured_files"],
                           "failed_files": coverage["failed_files"]},
          }
          (evidence / "release-frontend.json").write_text(
              json.dumps(document, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: 上传发布阶段前端证据
        if: inputs.stage == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-frontend
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Java 测试与真实集成依赖
    runs-on: ubuntu-latest
    outputs:
      # 阶段与用例数都由 reports 步骤真实写入 GITHUB_OUTPUT；本作业没有名为 stage 的步骤，
      # 绑定不存在的 steps.stage 会让两个输出永远为空，测试全部成功后汇总仍然失败。
      stage: ${{ steps.reports.outputs.stage }}
      checked: ${{ steps.reports.outputs.checked }}
    env:
      # MinIO 来源无法在仓库内证实，必须由仓库变量显式提供已固定的摘要引用。
      BF_CI_IMAGE_MINIO: ${{ vars.BF_CI_IMAGE_MINIO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装固定版本的 CI 工具依赖
        run: python -m pip install --require-hashes -r scripts/workflow/requirements-ci.txt

      - name: 安装固定 Maven
        run: bash scripts/workflow/install_ci_maven.sh

      # 镜像来源由 ci_services.py 统一核验：内置默认值与 BF_CI_IMAGE_MINIO 覆盖值都必须
      # 已按 sha256 摘要固定，未配置或未固定时这一步以退出码 2 红灯，不启动任何容器。
      - name: 核验 CI 服务镜像来源
        run: python -B -X utf8 scripts/workflow/ci_services.py images

      - name: 启动真实 MySQL、Redis、MinIO
        run: python -B -X utf8 scripts/workflow/ci_services.py start

      # Surefire 默认不包含 *IT；显式保留四种单测命名并纳入全部集成测试。
      # 无测试的 reactor 模块允许继续，reports 步骤仍拒绝零用例或必需类缺失。
      - name: 运行后端测试
        if: inputs.stage != 'release'
        working-directory: 后端代码/basic-framework-boot
        run: mvn -B -ntp '-Dtest=Test*,*Test,*Tests,*TestCase,*IT' -Dsurefire.failIfNoSpecifiedTests=false test

      # 第三方许可材料必须在发布打包**之前**生成并打进 JAR：Maven 的 <resources> 在
      # 目录缺失时静默跳过，构建照样成功，交付物却退回零份材料。因此发布阶段先打一次
      # 不带材料的 JAR，按真实依赖闭包生成材料，再重新打包；随后由独立门禁按交付 JAR
      # 的实际字节裁决，材料缺失或与闭包不一致都会让本作业失败。
      - name: 生成第三方许可材料（发布阶段前置）
        if: inputs.stage == 'release'
        working-directory: 后端代码/basic-framework-boot
        env:
          SERVER_JAR: ${{ github.workspace }}/后端代码/basic-framework-boot/basic-framework-server/target/basic-framework-server.jar
          MATERIALS: ${{ github.workspace }}/后端代码/basic-framework-boot/basic-framework-server/target/generated-license-materials
          METADATA: ${{ runner.temp }}/release-evidence/license-metadata.json
        run: |
          mvn -B -ntp -DskipTests package
          python -B -X utf8 "${{ github.workspace }}"/scripts/license/resolve_component_metadata.py \
            --jar "$SERVER_JAR" --allow-network \
            --cache-dir "${{ runner.temp }}/license-net-cache" \
            --additional-evidence "${{ github.workspace }}"/scripts/license/known_license_evidence.json \
            --out "$METADATA"
          python -B -X utf8 "${{ github.workspace }}"/scripts/license/generate_third_party_notices.py \
            --metadata "$METADATA" --jar "$SERVER_JAR" --out-dir "$MATERIALS"

      - name: 运行后端测试并采集覆盖率（发布阶段）
        if: inputs.stage == 'release'
        working-directory: 后端代码/basic-framework-boot
        run: mvn -B -ntp -Pquality-audit '-Dtest=Test*,*Test,*Tests,*TestCase,*IT' -Dsurefire.failIfNoSpecifiedTests=false verify

      - name: 发布阶段后端许可材料实查
        if: inputs.stage == 'release'
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence
        run: |
          mkdir -p "$EVIDENCE"
          python -B -X utf8 "${{ github.workspace }}"/scripts/license/verify_license_materials.py \
            --jar "${{ github.workspace }}"/后端代码/basic-framework-boot/basic-framework-server/target/basic-framework-server.jar \
            --require-prepared
          python -B -X utf8 "${{ github.workspace }}"/scripts/license/verify_license_materials.py \
            --jar "${{ github.workspace }}"/后端代码/basic-framework-boot/basic-framework-server/target/basic-framework-server.jar \
            --require-prepared --json > "$EVIDENCE/license-backend.json"

      # 性能预算：本步骤是**实查**，不是登记标签。它复用本作业已启动的真实
      # MySQL/Redis/MinIO（ci_services.py start 已把连接变量与 mysql 客户端包装器写入
      # GITHUB_ENV），自建隔离库、按两轮重启后端真实测量，合并报告后调用
      # perf_budget.py 裁决；退出码原样传递，报告目录必须位于仓库之外。超预算退出 1、
      # 环境失败退出 2，两者都让本作业失败；没有任何跳过、降级或 `|| true` 分支。
      #
      # 真实缺陷（run 37739234202）：判定子进程的 stdout 被写进 $PERF_OUT/verdict.json，
      # run_baseline.py 当时只打印「判定退出码 1」，逐条 findings 只存在于
      # $RUNNER_TEMP/perf-baseline 下的结论文件，而该目录在作业结束后不再保留；
      # 性能预算作业随后被判红，制品上传也被跳过，事后无法判断到底哪一类失败。
      # 因此这里先如实取回 run_baseline.py 的退出码，再无条件回显并归档结论文件，
      # 最后把**原退出码**交给作业判定：诊断可得，失败也不会被改写。
      #
      # 结论 verdict.json 原样复制为发布证据，汇总门禁随后独立复核——包括预算是否
      # 已获有权者批准、读数是否绑定本次发布的提交。当前 baseline-2026-10-07.json 仍是
      # proposed-awaiting-authority，汇总会因此拒绝发布证据：这是正确行为，本步骤不改写
      # 预算状态，也不提供豁免。
      #
      # 构件绑定：预算按 git_revision + source_sha256 绑定被测版本（perf-budget/v2），
      # 构件字节摘要不可复现、不能当绑定依据。作业已完成 checkout，因此显式取 HEAD 传入
      # 测量工具，让报告里的源码修订与本次构建同源；取不到修订就意味着绑定无法成立，
      # 此时直接失败而不是产出一份没有绑定的读数。
      - name: 发布阶段后端性能预算实查
        if: inputs.stage == 'release'
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence
          PERF_OUT: ${{ runner.temp }}/perf-baseline
        run: |
          mkdir -p "$EVIDENCE"
          if ! PERF_GIT_REVISION="$(git -C "${{ github.workspace }}" rev-parse HEAD)"; then
            echo "无法取得被测提交的 git 修订，性能预算的构件绑定无法成立" >&2
            exit 2
          fi
          echo "性能测量源码修订：$PERF_GIT_REVISION"
          set +e
          python -B -X utf8 "${{ github.workspace }}"/scripts/perf/run_baseline.py \
            --out-dir "$PERF_OUT" \
            --jar "${{ github.workspace }}"/后端代码/basic-framework-boot/basic-framework-server/target/basic-framework-server.jar \
            --budgets "${{ github.workspace }}"/scripts/perf/budgets/baseline-2026-10-07.json \
            --git-revision "$PERF_GIT_REVISION" \
            --source-root "${{ github.workspace }}"
          status=$?
          set -e
          # 判定结论只要存在就归档并整份回显到日志：日志与制品读到的是同一份字节。
          # 结论缺失时只如实记录，不据此改写退出码——环境失败仍然是 2，判定失败仍然是 1。
          if [ -s "$PERF_OUT/verdict.json" ]; then
            cp "$PERF_OUT/verdict.json" "$EVIDENCE/perf-budget.json"
            echo "性能预算判定结论（逐条 findings）："
            cat "$EVIDENCE/perf-budget.json"
          else
            echo "本次没有产出判定结论文件，run_baseline.py 退出码 $status；不据此改写结论" >&2
          fi
          exit $status

      # 逐条 findings 此前只存在于会被清理的临时目录，作业判红时又跳过了发布证据上传，
      # 事后无从定位。这里无论成败都取回本次真实写出的判定结论；未产出时用 warn 记录，
      # 缺文件不改变作业结论，也不把失败包装成通过。
      - name: 上传性能预算判定结论
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-verdict
          path: ${{ runner.temp }}/perf-baseline/verdict.json
          if-no-files-found: warn
          retention-days: 7

      # 真实缺陷（run 37745930988）：下载该次运行全部 9 个 artifact 后，merged.json /
      # latency.json / sql.json 命中数为 0，原始报告从未上传。verdict.json 只回答「哪几条
      # 超了」，对**没有触发 finding** 的指标只能按判定式反推成右删失上界，CI 侧真实的
      # 分位数分布与原始样本全部丢失，事后无法复核判定。
      #
      # perf_budget.py 的文档字符串要求报告保留全部原始样本：判定只用统计量，但保留
      # samples_ms 才能被独立复算。因此这里逐个列出本次运行真实写出的四个报告文件，
      # 而不是直接打包 $RUNNER_TEMP/perf-baseline —— 同一父目录旁边的应用日志、
      # bootstrap 日志与被测 JAR 都不是判定证据，打包进去只会撑大制品并带出运行细节。
      # verdict.json 与上一个 artifact 是同一份字节，重复收录只为让本制品自身完整：
      # 判定失败时可以在同一个 artifact 里同时取到逐条 findings 与支撑它的原始样本。
      - name: 上传性能测量原始报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-raw-reports
          path: |
            ${{ runner.temp }}/perf-baseline/merged.json
            ${{ runner.temp }}/perf-baseline/latency.json
            ${{ runner.temp }}/perf-baseline/sql.json
            ${{ runner.temp }}/perf-baseline/verdict.json
          if-no-files-found: warn
          retention-days: 7

      - name: 校验真实集成测试证据
        id: reports
        run: |
          python -B -X utf8 scripts/workflow/ci_gate.py reports \
            --backend 后端代码/basic-framework-boot
          printf 'stage=%s\n' "${{ inputs.stage || 'audit' }}" >> "$GITHUB_OUTPUT"

      # 发布门槛由覆盖率先按可读方式裁决：未达标时日志直接给出缺口，不写出任何证据；
      # 只有真实通过才再产出机器证据，避免把失败或审计结论写成发布证据。
      - name: 发布阶段后端覆盖率裁决
        if: inputs.stage == 'release'
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence
        run: |
          mkdir -p "$EVIDENCE"
          python -B -X utf8 scripts/workflow/coverage_gate.py --kind backend --stage release --require-prepared
          python -B -X utf8 scripts/workflow/coverage_gate.py --kind backend --stage release --require-prepared --json \
            > "$EVIDENCE/coverage-backend.json"

      - name: 生成发布阶段后端证据
        if: inputs.stage == 'release'
        env:
          EVIDENCE: ${{ runner.temp }}/release-evidence
          REVISION: ${{ github.sha }}
          JUNIT_CASES: ${{ steps.reports.outputs.checked }}
        run: |
          python -B -X utf8 - <<'PY'
          import json, os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE"])
          coverage = json.loads((evidence / "coverage-backend.json").read_text(encoding="utf-8"))
          # 许可材料实查的读数取自上一步门禁真实写出的 JSON：这里只复核状态，
          # 不在本步骤内重新编造条数；状态非 passed 会让作业在门禁那一步就已失败。
          license_gate = json.loads((evidence / "license-backend.json").read_text(encoding="utf-8"))
          if license_gate.get("status") != "passed" or license_gate.get("checks") is None:
              raise SystemExit("后端许可材料实查未真实通过")
          # 性能预算的读数同样取自上一步真实测量写出的 verdict.json：这里只复核判定
          # 结论与实测场景数，不在本步骤内重算任何数字。缺文件、仍有 finding 或没有
          # 正整数场景数都让本作业失败。预算的**权威状态**不在这里裁决——那是门禁的
          # 职责：ci_gate 按受控预算文件独立复核，未获有权者批准一律拒绝发布证据。
          perf_gate = json.loads((evidence / "perf-budget.json").read_text(encoding="utf-8"))
          if perf_gate.get("status") != "passed" or perf_gate.get("findings"):
              raise SystemExit("后端性能预算核对未真实通过")
          perf_checked = perf_gate.get("checked")
          if type(perf_checked) is not int or perf_checked <= 0:
              raise SystemExit("后端性能预算核对没有正整数的实测场景数")
          document = {
              "schema": "ci-release-evidence/v1",
              "job": "backend",
              "stage": "release",
              "revision": os.environ["REVISION"],
              "checks": [
                  {"name": "backend-tests-and-integration", "status": "passed",
                   "checked": int(os.environ["JUNIT_CASES"]),
                   "command": "mvn -B -ntp -Pquality-audit '-Dtest=Test*,*Test,*Tests,*TestCase,*IT' -Dsurefire.failIfNoSpecifiedTests=false verify"},
                  {"name": "backend-release-coverage", "status": "passed",
                   "checked": coverage["measured_files"],
                   "command": "python -B -X utf8 scripts/workflow/coverage_gate.py --kind backend --stage release --require-prepared --json"},
                  # 该检查按交付 JAR 字节裁决，没有可与用例数比对的第二份声明，声明 null。
                  {"name": "backend-license-materials", "status": "passed", "checked": None,
                   "command": "python -B -X utf8 ${GITHUB_WORKSPACE}/scripts/license/verify_license_materials.py --jar ${GITHUB_WORKSPACE}/后端代码/basic-framework-boot/basic-framework-server/target/basic-framework-server.jar --require-prepared --json"},
                  # 实测场景数取自上一步真实测量写出的 verdict.json；门禁随后按受控预算
                  # 文件独立复算场景数，并复核该预算是否已获有权者批准。
                  {"name": "backend-performance-budget", "status": "passed", "checked": perf_checked,
                   "command": "python -B -X utf8 ${GITHUB_WORKSPACE}/scripts/perf/run_baseline.py --out-dir <仓库外目录> --jar <本次构建 JAR> --budgets scripts/perf/budgets/baseline-2026-10-07.json"},
              ],
              "coverage": {"kind": "backend", "evidence": "coverage-backend.json", "stage": "release",
                           "measured_files": coverage["measured_files"],
                           "failed_files": coverage["failed_files"]},
          }
          (evidence / "release-backend.json").write_text(
              json.dumps(document, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: 上传发布阶段后端证据
        if: inputs.stage == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-backend
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 7

      # 无论成败都取回各模块 Surefire 报告：失败用例与堆栈只在这里，
      # 路径是 Maven 测试真实写出的 target/surefire-reports；测试未启动时用 warn 记录。
      - name: 上传后端测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: |
            后端代码/basic-framework-boot/**/target/surefire-reports/*.xml
            后端代码/basic-framework-boot/**/target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 7

      # 无论测试成败都回收本次运行自建的容器；所有权不匹配时拒绝删除并保留证据。
      - name: 停止真实服务
        if: always()
        run: python -B -X utf8 scripts/workflow/ci_services.py stop

  # 浏览器业务端到端：真实构建、真实隔离库、真实后端与真实 Chromium。
  # 本作业没有任何跳过或忽略分支：缺少镜像变量、缺少 Chromium、环境准备失败或用例失败
  # 都会让作业红灯，聚合门禁随即拒绝本次结论。
  browser_e2e:
    name: 浏览器业务端到端
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.count.outputs.stage }}
      checked: ${{ steps.count.outputs.checked }}
    env:
      # 与 backend 作业相同：MinIO 来源无法在仓库内证实，必须由仓库变量显式提供固定摘要。
      BF_CI_IMAGE_MINIO: ${{ vars.BF_CI_IMAGE_MINIO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装固定版本的 CI 工具依赖
        run: python -m pip install --require-hashes -r scripts/workflow/requirements-ci.txt

      - name: 安装固定 Maven
        run: bash scripts/workflow/install_ci_maven.sh

      # 镜像来源由 ci_services.py 统一核验：内置默认值与 BF_CI_IMAGE_MINIO 覆盖值都必须
      # 已按 sha256 摘要固定，未配置或未固定时这一步以退出码 2 红灯，不启动任何容器。
      - name: 核验 CI 服务镜像来源
        run: python -B -X utf8 scripts/workflow/ci_services.py images

      - name: 启动真实 MySQL、Redis、MinIO
        run: python -B -X utf8 scripts/workflow/ci_services.py start

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 前端代码/basic-framework-admin/pnpm-lock.yaml

      - name: 安装管理前端依赖
        working-directory: 前端代码/basic-framework-admin
        run: pnpm install --frozen-lockfile

      # 浏览器缺失时用例会直接失败；这里显式安装并补齐系统依赖，不把缺失当跳过。
      - name: 安装 Playwright Chromium
        working-directory: 前端代码/basic-framework-admin
        run: pnpm exec playwright install --with-deps chromium

      # 连接变量由上一步写入 GITHUB_ENV：AUTH_TEST_MYSQL_*、BF_TEST_REDIS_*、
      # BF_TEST_S3_*、BF_TEST_MYSQL_CLIENT；凭据只存在于 runner 临时环境。
      - name: 执行浏览器业务端到端
        id: e2e
        env:
          SUMMARY: ${{ runner.temp }}/business-e2e.json
          RESULTS: ${{ runner.temp }}/business-e2e-results
        run: python -B -X utf8 scripts/e2e/run_business_e2e.py --summary "$SUMMARY" --results "$RESULTS"

      # 失败痕迹与用例摘要都要在失败时也取回：business-e2e.json 由本次运行实际写出，
      # 痕迹目录来自 --results。两者都是真实路径；未产生时用 warn 记录，不改变作业结论。
      - name: 上传浏览器用例摘要与失败痕迹
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-e2e-results
          path: |
            ${{ runner.temp }}/business-e2e.json
            ${{ runner.temp }}/business-e2e-results
          if-no-files-found: warn
          retention-days: 7

      # 只统计本次真实执行的用例数；跳过、重试通过与零用例都不算通过。
      - name: 汇总真实用例数
        id: count
        env:
          SUMMARY: ${{ runner.temp }}/business-e2e.json
          STAGE: ${{ inputs.stage || 'audit' }}
        run: |
          python -B -X utf8 - <<'PY'
          import json, os, sys
          output = os.environ.get("GITHUB_OUTPUT")
          if not output:
              sys.exit("缺少 GITHUB_OUTPUT：无法上报本次真实用例数")
          summary = json.load(open(os.environ["SUMMARY"], encoding="utf-8"))
          total = int(summary.get("total", 0))
          failed = int(summary.get("failed", 0))
          skipped = int(summary.get("skipped", 0))
          flaky = int(summary.get("flaky", 0))
          if total <= 0:
              sys.exit("浏览器业务端到端没有实际用例，browser_e2e 不计为通过")
          if summary.get("status") != "passed" or failed or skipped or flaky:
              sys.exit(f"浏览器业务端到端存在失败 {failed}、跳过 {skipped}、重试通过 {flaky}，不计为通过")
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"checked={total}\n")
              stream.write(f"stage={os.environ['STAGE']}\n")
          PY

      # 与 backend 作业同一清理职责：无论成败都回收本次自建容器。
      - name: 停止真实服务
        if: always()
        run: python -B -X utf8 scripts/workflow/ci_services.py stop

  gate:
    name: 门禁汇总
    runs-on: ubuntu-latest
    # 必需作业失败或被跳过时仍要产出结论，避免出现"没有结论"的绿灯。
    if: always()
    needs:
      - docs_tools
      - backend
      - frontend
      - browser_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 发布证据只能来自真实作业产出：作业失败时跳过取回，让聚合门禁直接报告真实原因，
      # 而不是用下载失败掩盖首个失败。缺少制品时下载本身也会失败，结论仍然是红灯。
      #
      # 来源验收报告（source-acceptance-report/v1）由 docs_tools 的全量 Java 注释检查
      # 真实写出并上传；这里取回到 $RUNNER_TEMP/release-evidence，正好是 ci_gate 既有
      # 要求的位置（目录下的 source-acceptance-report.json，或 SOURCE_ACCEPTANCE_REPORT）。
      # 取回失败或报告缺失时 release 汇总按受控失败退出 1，不输出成功结论。
      - name: 取回来源验收报告
        if: inputs.stage == 'release' && needs.docs_tools.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-source
          path: ${{ runner.temp }}/release-evidence

      - name: 取回发布阶段后端证据
        if: inputs.stage == 'release' && needs.backend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-backend
          path: ${{ runner.temp }}/release-evidence

      - name: 取回发布阶段前端证据
        if: inputs.stage == 'release' && needs.frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-frontend
          path: ${{ runner.temp }}/release-evidence

      # toJSON(needs) 保留每个作业的真实 result；skipped/cancelled 会被 aggregate 拒绝。
      # release 阶段还要求取回的真实发布证据绑定到本次提交，缺少或不一致一律拒绝。
      - name: 核对必需作业与真实用例
        env:
          STAGE: ${{ inputs.stage || 'audit' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_EVIDENCE: ${{ runner.temp }}/release-evidence
          CI_REVISION: ${{ github.sha }}
        run: python -B -X utf8 scripts/workflow/ci_gate.py aggregate --stage "$STAGE"
