name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Maven quality-gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 后端代码/basic-framework-boot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: 后端代码/basic-framework-boot/**/pom.xml
      - name: Maven quality-gate verify
        run: mvn -B -ntp -Pquality-gate verify

  frontend:
    name: frontend (unit + typecheck + lint + build)
    runs-on: ubuntu-latest
    env:
      # GitHub runner 默认 TZ=UTC；仓库时区相关单测期望 IANA 区域名（如 Asia/Shanghai）。
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: 前端代码/basic-framework-admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: 前端代码/basic-framework-admin/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: OpenAPI contract check
        run: pnpm api:check
      - name: Workspace & architecture audit
        run: |
          pnpm quality:workspace
          pnpm quality:development
          pnpm graph:modules:check
      - name: Circular & dependency check
        run: |
          pnpm check:circular
          pnpm check:dep
      - name: Unit tests
        run: pnpm test:unit
      - name: Typecheck
        run: pnpm check:type
      - name: Lint
        run: pnpm lint
      - name: Build web-ele
        run: pnpm build:ele
      - name: Production security & bundle budget scan
        run: pnpm quality:prod-scan

  docs-comments:
    name: docs + comments
    runs-on: ubuntu-latest
    env:
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install quality tooling
        run: python -m pip install -r tools/quality/requirements.txt
      - name: Resolve comparison baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            base="$(GIT_AUTHOR_NAME=quality-gate GIT_AUTHOR_EMAIL=quality-gate@invalid GIT_COMMITTER_NAME=quality-gate GIT_COMMITTER_EMAIL=quality-gate@invalid git commit-tree "$empty_tree" -m "quality gate empty baseline")"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: 前端代码/basic-framework-admin/pnpm-lock.yaml
      - name: Install web parser
        working-directory: 前端代码/basic-framework-admin
        run: pnpm install --frozen-lockfile
      - name: Docs checks (mermaid excluded)
        run: |
          set -euo pipefail
          # mermaid 检查仍不在本 job 执行；前端依赖已为 comments 暂存检查安装。
          echo "Skipping mermaid: not part of this job's docs checks; frontend dependencies are installed for staged comments checks."
          python -B -X utf8 scripts/workflow/run_checks.py --checks md-links skills doc-refs package-readmes doc-structure doc-policy note-classification note-format
      - name: Comments checks
        run: |
          set -euo pipefail
          python -B -X utf8 scripts/workflow/run_checks.py --group comments --base "${{ steps.baseline.outputs.sha }}"
      - name: PR slice size guard
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          CHANGED_LINES="$(git diff --numstat "$BASE_SHA" HEAD -- . \
            ':!pnpm-lock.yaml' \
            ':!*/pnpm-lock.yaml' \
            ':!*/openapi.json' \
            ':!*/api-types.d.ts' \
            ':!docs/开发指南/模块依赖关系图.md' \
            | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { sum += $1 + $2 } END { print sum + 0 }')"
          echo "Non-generated PR changed lines: $CHANGED_LINES"
          if [ "$CHANGED_LINES" -gt 600 ] && [[ "${PR_BODY:-}" != *"[slice-override]"* ]]; then
            echo "PR non-generated diff ($CHANGED_LINES lines) exceeds 600-line slice budget; split into smaller PRs or add [slice-override] rationale in PR body." >&2
            exit 1
          fi

  pytest:
    name: pytest (scripts/tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: 前端代码/basic-framework-admin/pnpm-lock.yaml
      - name: Install quality tooling
        run: python -m pip install -r tools/quality/requirements.txt
      - name: Install web parser
        working-directory: 前端代码/basic-framework-admin
        run: pnpm install --frozen-lockfile
      - name: Pytest tooling tests
        run: python -B -X utf8 -m pytest scripts/tests

  secrets-scan:
    name: secrets scan (staged-equivalent)
    runs-on: ubuntu-latest
    env:
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve comparison baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            base="$(GIT_AUTHOR_NAME=quality-gate GIT_AUTHOR_EMAIL=quality-gate@invalid GIT_COMMITTER_NAME=quality-gate GIT_COMMITTER_EMAIL=quality-gate@invalid git commit-tree "$empty_tree" -m "quality gate empty baseline")"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Scan changed files for secrets
        run: |
          set -euo pipefail
          # 脚本只扫 git 暂存区，不接受文件路径参数。
          BASE="${{ steps.baseline.outputs.sha }}"
          if [ -z "$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)" ]; then
            echo "No changed files to scan."
            exit 0
          fi
          # 索引对齐到 BASE，工作区保持 HEAD，再 add 全部差异，等价于扫本次变更。
          git reset --mixed "$BASE"
          git add -A
          python -B -X utf8 scripts/security/scan_staged_secrets.py
