version: 2

updates:
  # Java 后端：Maven 聚合工程根目录。
  - package-ecosystem: maven
    directory: /后端代码/basic-framework-boot
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 管理前端：pnpm 工程由 Dependabot 的 npm 生态读取 pnpm-lock.yaml。
  - package-ecosystem: npm
    directory: /前端代码/basic-framework-admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions：工作流中引用的 action 版本。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
